<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark"><head><meta charset="utf-8"><title>ساعت تهران</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#191919;--fg:#ffffffcf;--mut:#ffffff73;--ac:#e8a56b;color-scheme:dark}
:root[data-theme=light]{--bg:#ffffff;--fg:#37352f;--mut:#37352f80;--ac:#c2410c;color-scheme:light}
html,body{height:100%;margin:0;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center;color:var(--fg);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;text-align:center}
.t{font-size:clamp(40px,14vw,84px);font-weight:300;line-height:1.2;font-variant-numeric:tabular-nums;direction:ltr;letter-spacing:.02em}
.t i{font-style:normal;color:var(--ac);animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:.25}}
.d{font-size:clamp(14px,4vw,18px);color:var(--mut);margin-top:2px}
.s{font-size:12px;color:var(--mut);opacity:.7;margin-top:8px;direction:ltr}
</style></head><body>
<div><div class="t" id="t"></div><div class="d" id="d"></div><div class="s" id="s"></div></div>
<script>
var q=new URLSearchParams(location.search).get('theme');if(q==='light'||q==='dark')document.documentElement.dataset.theme=q;
var Z='Asia/Tehran';
var ft=new Intl.DateTimeFormat('fa-IR',{timeZone:Z,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
var fd=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{timeZone:Z,weekday:'long',year:'numeric',month:'long',day:'numeric'});
var fe=new Intl.DateTimeFormat('en-GB',{timeZone:Z,day:'numeric',month:'short',year:'numeric'});
function tick(){var n=new Date();
document.getElementById('t').innerHTML=ft.format(n).replace(/[:٫]/g,'<i>:</i>');
document.getElementById('d').textContent=fd.format(n).replace(/[,،]\s*/,' ');
document.getElementById('s').textContent=fe.format(n)+' · Tehran'}
tick();setInterval(tick,1000);
</script></body></html>
