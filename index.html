<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>ساعت تهران</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--fg:#1d1d1b;--mut:#6b6b66;--ac:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--fg:#f2f1ec;--mut:#a3a29b;--ac:#fb923c}}
:root[data-theme=dark]{--fg:#f2f1ec;--mut:#a3a29b;--ac:#fb923c}
html,body{height:100%;margin:0;background:transparent}
body{display:flex;align-items:center;justify-content:center;color:var(--fg);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;text-align:center}
.w{padding:12px}
.g{font-size:14px;color:var(--ac);letter-spacing:.02em}
.t{font-size:clamp(44px,16vw,96px);font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;direction:ltr}
.d{font-size:clamp(15px,4.5vw,22px);margin-top:4px}
.s{font-size:13px;color:var(--mut);margin-top:6px;direction:ltr}
</style></head><body>
<div class="w"><div class="g" id="g"></div><div class="t" id="t">--:--:--</div><div class="d" id="d"></div><div class="s" id="s"></div></div>
<script>
var q=new URLSearchParams(location.search).get('theme');if(q==='dark'||q==='light')document.documentElement.dataset.theme=q;
var Z='Asia/Tehran';
var ft=new Intl.DateTimeFormat('fa-IR',{timeZone:Z,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
var fd=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{timeZone:Z,weekday:'long',year:'numeric',month:'long',day:'numeric'});
var fe=new Intl.DateTimeFormat('en-GB',{timeZone:Z,weekday:'short',day:'numeric',month:'short',year:'numeric'});
var fh=new Intl.DateTimeFormat('en-GB',{timeZone:Z,hour:'numeric',hourCycle:'h23'});
function tick(){var n=new Date(),h=+fh.format(n);
document.getElementById('t').textContent=ft.format(n);
document.getElementById('d').textContent=fd.format(n);
document.getElementById('s').textContent=fe.format(n)+' · Tehran (UTC+3:30)';
document.getElementById('g').textContent=h<5?'شب بخیر 🌙':h<12?'صبح بخیر ☀️':h<17?'ظهر بخیر 🌤️':h<20?'عصر بخیر 🌇':'شب بخیر 🌙'}
tick();setInterval(tick,1000);
</script></body></html>
